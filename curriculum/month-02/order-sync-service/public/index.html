<!DOCTYPE html>
<html>
<head>
  <title>Order Sync Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Order Sync Dashboard</h1>

  <div class="tabs">
    <button onclick="showTab('db1')">Database 1</button>
    <button onclick="showTab('db2')">Database 2</button>
  </div>

  <!-- DATABASE 1 -->
  <div id="db1" class="tab-content">

    <button onclick="openModal()">
      Add New Record
    </button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>External ID</th>
          <th>Customer</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="ordersTable"></tbody>
    </table>

  </div>

  <!-- DATABASE 2 -->
  <div id="db2" class="tab-content" style="display:none;">

    <button onclick="syncDatabase()">
      Sync Records
    </button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>External ID</th>
          <th>Customer</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="ordersTable2"></tbody>
    </table>

  </div>

  <!-- MODAL -->
  <div id="modal" class="modal">

    <div class="modal-content">

      <h2>Add Order</h2>

      <input id="external_id" placeholder="External ID">

      <input id="customer_name" placeholder="Customer Name">

      <input id="amount" placeholder="Amount">

      <select id="status">
        <option value="pending">pending</option>
        <option value="completed">completed</option>
        <option value="failed">failed</option>
      </select>

      <button onclick="addOrder()">
        Save Order
      </button>

      <button onclick="closeModal()">
        Close
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
